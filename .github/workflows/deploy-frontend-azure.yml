name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-azure.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p frontend/deploy
          cp -r frontend/dist frontend/deploy/dist
          cp frontend/package.json frontend/deploy/package.json
          cp frontend/server.js frontend/deploy/server.js

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Secret AZURE_CREDENTIALS is empty. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}" ]; then
            echo "::error::Secret AZURE_WEBAPP_NAME_FRONTEND is empty. Add the Azure App Service name exactly as created in Azure."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}
          package: frontend/deploy
