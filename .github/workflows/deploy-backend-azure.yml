name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Secret AZURE_CREDENTIALS is empty. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}" ]; then
            echo "::error::Secret AZURE_WEBAPP_NAME_BACKEND is empty. Add the Azure App Service name exactly as created in Azure."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Web App
        run: |
          APP_NAME="${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}"
          if [ -z "$APP_NAME" ]; then
            echo "::error::Secret AZURE_WEBAPP_NAME_BACKEND is empty. Add the exact Azure Web App name."
            exit 1
          fi
          echo "Checking Azure Web App name: $APP_NAME"
          az account show --query "{subscriptionId:id, tenantId:tenantId}" -o json
          echo "Available web apps in the current subscription:"
          az webapp list --query "[].name" -o table || true
          az webapp show --name "$APP_NAME" --query name -o tsv > /tmp/appname.txt 2>/tmp/appname.err || true
          if [ ! -s /tmp/appname.txt ]; then
            echo "::error::Azure Web App '$APP_NAME' was not found. Check the app name in GitHub secret AZURE_WEBAPP_NAME_BACKEND."
            cat /tmp/appname.err || true
            exit 1
          fi
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings WEBSITE_RUN_FROM_PACKAGE=1 WEBSITES_PORT=80 JAVA_OPTS="-Dserver.port=80" SERVER_PORT=80
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --always-on true

      - name: Deploy JAR to Azure Web App
        run: |
          APP_NAME="${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}"
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path backend/target/horse-racing-backend.jar \
            --type jar

      - name: Restart Azure Web App
        run: |
          APP_NAME="${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}"
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"
