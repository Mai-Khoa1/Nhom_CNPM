name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Validate deployment credentials
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Secret AZURE_CREDENTIALS is empty. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Resolve Azure Web App name
        run: |
          APP_NAME="${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="horse-racing-api"
            echo "Using default Azure Web App name: $APP_NAME"
          else
            echo "Using Azure Web App name from secret: $APP_NAME"
          fi
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Azure subscription and web app
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          echo "Checking Azure Web App name: $APP_NAME"
          az account show --query "{subscriptionId:id, tenantId:tenantId}" -o json

          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUBSCRIPTION_ID" ]; then
            echo "Using subscription from secret: $SUBSCRIPTION_ID"
            az account set --subscription "$SUBSCRIPTION_ID"
          else
            echo "No AZURE_SUBSCRIPTION_ID secret provided. Scanning subscriptions accessible to the provided credentials..."
            FOUND_SUBSCRIPTION=""
            for SUB in $(az account list --query "[].id" -o tsv); do
              az account set --subscription "$SUB" >/dev/null 2>&1 || true
              if az webapp show --name "$APP_NAME" --query name -o tsv > /tmp/appname.txt 2>/tmp/appname.err 2>/dev/null; then
                FOUND_SUBSCRIPTION="$SUB"
                break
              fi
            done
            if [ -z "$FOUND_SUBSCRIPTION" ]; then
              echo "::error::Azure Web App '$APP_NAME' was not found in any subscription accessible to the provided credentials."
              echo "Available subscriptions:"
              az account list --query "[].{name:name,id:id}" -o table || true
              cat /tmp/appname.err || true
              exit 1
            fi
            az account set --subscription "$FOUND_SUBSCRIPTION"
            echo "Using subscription: $FOUND_SUBSCRIPTION"
            SUBSCRIPTION_ID="$FOUND_SUBSCRIPTION"
          fi
          echo "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> "$GITHUB_ENV"

      - name: Configure Azure Web App
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          echo "Checking Azure Web App name: $APP_NAME"
          echo "Available web apps in the resolved subscription:"
          az webapp list --query "[].name" -o table || true
          az webapp show --name "$APP_NAME" --query name -o tsv > /tmp/appname.txt 2>/tmp/appname.err || true
          if [ ! -s /tmp/appname.txt ]; then
            echo "::error::Azure Web App '$APP_NAME' was not found after resolving the subscription."
            cat /tmp/appname.err || true
            exit 1
          fi
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings WEBSITE_RUN_FROM_PACKAGE=1 WEBSITES_PORT=80 JAVA_OPTS="-Dserver.port=80" SERVER_PORT=80
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --always-on true

      - name: Deploy JAR to Azure Web App
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path backend/target/horse-racing-backend.jar \
            --type jar

      - name: Restart Azure Web App
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          RESOURCE_GROUP=$(az webapp show --name "$APP_NAME" --query resourceGroup -o tsv)
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME"
