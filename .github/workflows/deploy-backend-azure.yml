name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Secret AZURE_CREDENTIALS is empty. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}" ]; then
            echo "::error::Secret AZURE_WEBAPP_NAME_BACKEND is empty. Add the Azure App Service name exactly as created in Azure."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
          package: backend/target/horse-racing-backend.jar
          startup-file: java -jar /home/site/wwwroot/horse-racing-backend.jar
