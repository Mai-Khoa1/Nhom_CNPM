name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Secret AZURE_CREDENTIALS is empty."
            exit 1
          fi
          if [ -z "$APP_NAME" ]; then
            echo "::error::Secret AZURE_WEBAPP_NAME_BACKEND is empty."
            exit 1
          fi
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Secret AZURE_RESOURCE_GROUP is empty."
            exit 1
          fi

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Verify built JAR exists
        run: |
          JAR_PATH="backend/target/horse-racing-backend.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::Expected JAR not found at $JAR_PATH"
            ls -la backend/target || true
            exit 1
          fi
          echo "Found JAR: $JAR_PATH"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Debug Azure context
        run: |
          echo "Azure account:"
          az account show -o table || true
          echo "Available Web Apps:"
          az webapp list --query "[].{Name:name,RG:resourceGroup}" -o table || true

      - name: Verify Azure Web App
        run: |
          echo "Checking App Service: $APP_NAME"
          echo "Resource Group: $RESOURCE_GROUP"
          az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query "{name:name,resourceGroup:resourceGroup}" -o json

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings WEBSITE_RUN_FROM_PACKAGE=1 WEBSITES_PORT=80 JAVA_OPTS="-Dserver.port=80" SERVER_PORT=80

          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --always-on true || true

      - name: Deploy JAR to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path backend/target/horse-racing-backend.jar \
            --type jar

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME"
