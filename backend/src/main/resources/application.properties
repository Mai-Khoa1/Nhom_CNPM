# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://horse-buimaikhoa.mysql.database.azure.com:3306/horse_racing?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=REQUIRED
spring.datasource.username=${buimaikhoa2026}
spring.datasource.password=${DB_PASSWORD:Khoa0862761543!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Giữ nguyên tên bảng/cột đúng như khai báo @Table/@Column (không tự chuyển camelCase -> snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.defer-datasource-initialization=true

# Khởi tạo schema.sql + data.sql mỗi lần start (các lệnh đều idempotent: IF NOT EXISTS / INSERT IGNORE)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8

# JWT Configuration
jwt.secret=${JWT_SECRET:horse_racing_super_secret_jwt_key_for_production_2026_security_system_backend_api_very_long_key_secure}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS - cổng 3000/5173 là dev server của frontend (Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500}

# Thư mục lưu file upload
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson - serialize LocalDateTime/LocalDate/LocalTime thành ISO-8601 string, không phải array timestamp
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false